      P([new TextRun({text: `Day ${d.n}: ${from}${from !== to ? ' to ' + to : ''}`, color: colHex})], {heading: HeadingLevel.HEADING_1, spacing: {before: 360}});
      if (d.date) P([new TextRun({text: dayDateLong(d), bold: true})]);
      P([new TextRun({text: `${milesWord(d.d)}  ·  about ${hrsWord(d.s)} of driving`, color: '444444'})]);
      if (d.ferry) P([new TextRun({text: `Includes a ferry crossing: ${milesWord(d.ferry.d)}, about ${hrsWord(d.ferry.t)} on the water (plus boarding time).`, color: '0369A1'})]);
      try { const img = await dayMapImage(t, st, d); if (img) P([new ImageRun({data: img.data, transformation: {width: 624, height: Math.round(624 * img.h / img.w)}})], {spacing: {before: 120, after: 80}}); } catch (e) { console.error('day map', e); }
      P([new TextRun({text: 'Stops', bold: true})], {spacing: {before: 120}});
      for (let k = 0; k < d.idx.length; k++) {
        const i = d.idx[k]; const stop = t.route[i]; const p = pinById(stop.pinId); const pl = pinLabel(p);
        const endOfDay = k === d.idx.length - 1;
        const lead = k === 0 ? (d.seg === 0 ? 'Start: ' : 'Leave: ') : (endOfDay ? (i === t.route.length - 1 ? 'Trip ends: ' : 'Overnight: ') : '');
        P([new TextRun({text: lead, bold: true}), new TextRun({text: p.name, bold: true}), ...(pl && !p.address ? [new TextRun({text: `  (${pl})`, color: '666666'})] : [])], {bullet: {level: 0}, spacing: {before: 80}});
        if (p.address) P([new TextRun({text: p.address, color: '444444'})], {indent: {left: 720}});
        if (!(k === 0 && d.seg > 0)) {
          if (p.notes) p.notes.split('\n').filter(x => x.trim()).forEach(line => P([new TextRun({text: line, color: '333333'})], {indent: {left: 720}}));
          p.links.forEach(l => P([new ExternalHyperlink({children: [new TextRun({text: l.url, style: 'Hyperlink'})], link: l.url})], {indent: {left: 720}}));
        }
        if (p.stay && !shown.has(p.id) && (endOfDay || k > 0)) await addStay(p, stop);
        if (k < d.idx.length - 1) { const x = st.legs[i] && st.legs[i].info; const next = stopTitle(t, d.idx[k + 1]);
          P([new TextRun({text: x && x.status === 'ok' ? `→ Drive ${milesWord(x.d)}, about ${hrsWord(x.t)}, to ${next}${x.ferry ? ' (includes a ferry)' : ''}` : `→ Drive to ${next} (driving time unknown)`, italics: true, color: colHex})], {indent: {left: 720}, spacing: {before: 40}}); }
      }
    }
    const inRoute = new Set(t.route.map(s => s.pinId)); const others = t.pins.filter(p => !inRoute.has(p.id));
    if (others.length) {
      P([new TextRun('Other saved places (not on the route)')], {heading: HeadingLevel.HEADING_1, spacing: {before: 400}});
      t.layers.forEach(l => { const ps = others.filter(p => p.layerId === l.id); if (!ps.length) return; if (t.layers.length > 1) P([new TextRun({text: l.name, bold: true})], {spacing: {before: 160}});
        ps.forEach(p => { const pl = pinLabel(p); P([new TextRun({text: p.name}), ...(pl ? [new TextRun({text: `  (${pl})`, color: '666666'})] : []), ...(p.notes ? [new TextRun({text: ` — ${p.notes.replace(/\s*\n\s*/g, ' ')}`, color: '555555'})] : [])], {bullet: {level: 0}}); }); });
    }
    P([new TextRun({text: `Made with Larson Family Maps on ${new Date().toLocaleDateString()}. Drive times are estimates without traffic or stops.`, size: 18, color: '888888', italics: true})], {spacing: {before: 400}});
    const doc = new Document({creator: 'Larson Family Maps', title: t.name, styles: {default: {document: {run: {font: 'Calibri', size: 23}}}}, sections: [{properties: {page: {margin: {top: 1080, bottom: 1080, left: 1080, right: 1080}}}, children: C}]});
    const blob = await Packer.toBlob(doc);
    download(blob, `${safeName(t.name)} - Itinerary.docx`);
    toast('Itinerary exported. Look in your Downloads folder.');
  } catch (err) { console.error(err); toast('Couldn’t export the itinerary. Check your internet connection and try again.', {err: true, ms: 7000}); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}
function planText(){
  const {t, st, days} = planData(); const L = [];
  L.push(t.name.toUpperCase()); L.push(`${days.length} day${days.length === 1 ? '' : 's'} · ${t.route.length} stops · ${milesWord(st.d)} · about ${hrsWord(st.s)} of driving`);
  const lodging = lodgingTotals(t); if (lodging) L.push('Lodging: ' + lodging); L.push('');
  const shown = new Set();
  for (const d of days) {
    if (d.kind === 'layover') { L.push(`Day ${d.n}: Layover in ${stopTown(t, d.idx[0])}${d.date ? ' (' + dayDateLong(d) + ')' : ''}`); L.push(`  No driving. Night ${d.night} of ${d.nights}.`); L.push(''); continue; }
    const from = stopTown(t, d.idx[0]), to = stopTown(t, d.idx[d.idx.length - 1]);
    L.push(`Day ${d.n}: ${from}${from !== to ? ' to ' + to : ''}${d.date ? ' (' + dayDateLong(d) + ')' : ''}`);
    L.push(`  ${milesWord(d.d)} · about ${hrsWord(d.s)} of driving${d.ferry ? ' · includes a ferry' : ''}`);
    d.idx.forEach((i, k) => {
      const p = pinById(t.route[i].pinId); L.push(`  • ${p.name}${p.address ? ' — ' + p.address : pinLabel(p) ? ' (' + pinLabel(p) + ')' : ''}`);
      if (!(k === 0 && d.seg > 0)) { if (p.notes) L.push('      ' + p.notes.replace(/\n+/g, ' / ')); p.links.forEach(l => L.push('      ' + l.url)); }
      if (p.stay && !shown.has(p.id) && k > 0) { shown.add(p.id); const s = p.stay; const sh = stayShows(s); L.push(`      STAYING: ${stayLabel(s)}` + [sh.site && s.site && 'site ' + s.site, sh.phone && s.phone, sh.times && s.checkin && 'check-in ' + s.checkin, sh.times && s.checkout && 'check-out ' + s.checkout, sh.conf && s.conf && 'conf. #' + s.conf, sh.money && parseMoney(s.paid) !== null && money(s.paid) + ' paid', sh.money && parseMoney(s.due) !== null && money(s.due) + ' due on arrival', sh.perks && s.reward && 'reward night', sh.perks && s.points && 'paid with points', sh.amen && stayAmenList(s).length && 'has ' + stayAmenList(s).join(', ')].filter(Boolean).map(x => ' · ' + x).join('')); if (s.notes) L.push(`      ${stayNotesLabel(s)}: ` + s.notes.replace(/\n+/g, ' / ')); }
      if (k < d.idx.length - 1) { const x = st.legs[i]?.info; if (x && x.status === 'ok') L.push(`      → ${miles(x.d)}, ${hrs(x.t)}`); }
    });
    L.push('');
  }
  return L.join('\n');
}
async function copyText(){
  const txt = planText();
  try { await navigator.clipboard.writeText(txt); toast('Itinerary copied. Paste it into an email, note or document.'); }
  catch { modal({title: 'Trip itinerary', html: `<p>Select all of this text and copy it:</p><textarea class="input" style="min-height:300px;font-size:14px" readonly>${esc(txt)}</textarea>`, buttons: [{label: 'Close', kind: 'blue'}]}); }
}

/* =========================================================
   HELP + WELCOME
   ========================================================= */
function stepsHtml(){
  return `<div class="welcome-steps">
    <div><span class="n" style="background:var(--pins)">1</span><span><b>Pins.</b> Drop every place you might want to see. Press <b>Add pins</b> and click the map, or search for a place. Click any pin to name it, add notes and links, and pick an icon and color.<p></p></span></div>
    <div><span class="n" style="background:var(--route)">2</span><span><b>Route.</b> Connect the dots: click pins in the order you’ll visit them. You’ll see the miles and driving time for every drive. Drag stops to change the order, or press <b>Suggest order</b>.</span></div>
    <div><span class="n" style="background:var(--days)">3</span><span><b>Days.</b> Press <b>End day</b> on the stops where you’ll sleep, and use <b>+</b> for extra nights. Or press <b>Split into days</b> and the site suggests towns to stop in. Then export the day-by-day trip itinerary, with maps and all your stay details.</span></div></div>`;
}
function showWelcome(){
  modal({title: 'Welcome to Larson Family Maps', html: `<p>Plan a trip in three steps:</p>${stepsHtml()}<p>Everything saves automatically in this browser. Made a mistake? Press <i class="fa-solid fa-rotate-left"></i> Undo at the top.</p>`, buttons: [{label: 'Let’s go', kind: 'green'}]}).then(() => { prefs.seenWelcome = true; savePrefs(); });
}
function showHelp(){
  modal({title: 'How to use Larson Family Maps', wide: true, html: `${stepsHtml()}
    <h3 style="margin:18px 0 6px">Bring in a trip from Google My Maps</h3>
    <ol><li>On a computer, go to <b>google.com/maps/d</b> and open the map.</li><li>Click the <b>three dots ⋮</b> next to the map’s name.</li><li>Click <b>Export to KML/KMZ</b>.</li><li>Choose <b>Entire map</b>, then click <b>Download</b>.</li><li>Here, click <b>☰</b> (top right), then <b>Import a Google My Map</b>, and pick the file. You can also drag the file onto this page.</li></ol>
    <h3 style="margin:18px 0 6px">Measure a distance</h3><p>Click <b>Measure</b> on the map, then click two or more spots. You get the straight-line distance and the driving distance and time. Nothing is saved.</p>
    <h3 style="margin:18px 0 6px">Where your trips are saved</h3><p>Trips save in <b>this browser on this device</b>. Use <b>☰ → Download a backup</b> now and then, and keep the file somewhere safe. Clearing your browser’s website data would erase trips that aren’t backed up.</p>`,
    buttons: [{label: 'Got it', kind: 'blue'}]});
}

/* ---------- mobile panel toggle ---------- */
function updateHandle(){ const c = $('#panel').classList.contains('collapsed'); $('#mobHandle').innerHTML = c ? '<i class="fa-solid fa-chevron-up"></i><span>Show list</span>' : '<i class="fa-solid fa-chevron-down"></i><span>Hide list</span>'; }
$('#mobHandle').onclick = () => { $('#panel').classList.toggle('collapsed'); updateHandle(); setTimeout(() => map.invalidateSize(), 220); };
window.addEventListener('resize', () => map.invalidateSize());

/* =========================================================
   START
   ========================================================= */
load();
ui.step = ['pins', 'route', 'days'].includes(prefs.step) ? prefs.step : 'pins';
setBasemap(prefs.basemap);
render();
if (trip().pins.length) fitTrip();
if (!storageOK) toast('This browser is blocking saving. Your trips won’t be kept after you close the page.', {err: true, ms: 12000});
if (!prefs.seenWelcome) showWelcome();
setTimeout(cleanupPhotos, 8000);
</script>
