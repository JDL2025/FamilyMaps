<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Larson Family Maps</title>
<meta name="theme-color" content="#0e1218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Larson Maps">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 42'%3E%3Cpath d='M16 1C7.7 1 1 7.6 1 15.8c0 10.6 13.2 24 14.1 25a1.2 1.2 0 0 0 1.8 0C17.8 39.8 31 26.4 31 15.8 31 7.6 24.3 1 16 1z' fill='%2322c55e'/%3E%3Ccircle cx='16' cy='15.5' r='5.5' fill='%230e1218'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#0e1218; --panel:#151a22; --panel2:#1c222c; --panel3:#262d3a; --line:#2e3646;
  --text:#eef1f6; --muted:#a6b0c0; --faint:#748094;
  --pins:#3b82f6; --route:#22c55e; --days:#f59e0b; --doc:#a855f7; --danger:#ef4444;
  --measure:#facc15; --ferry:#38bdf8;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
[hidden]{display:none!important}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:1200;position:relative}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;white-space:nowrap}
.brand svg{width:22px;height:29px}
.trip-btn{display:flex;align-items:center;gap:8px;max-width:280px;min-height:44px;padding:8px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.trip-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-btn:hover{background:var(--panel3)}
.steps{display:flex;gap:8px;margin:0 auto}
.step{display:flex;align-items:center;gap:9px;min-height:46px;padding:8px 18px 8px 9px;border-radius:999px;border:2px solid var(--line);background:var(--panel2);font-weight:700;font-size:16px;white-space:nowrap;transition:background .15s,border-color .15s}
.step .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel3);font-size:15px}
.step:hover{border-color:#4a556a}
.step[data-step=pins]{--c:var(--pins)} .step[data-step=route]{--c:var(--route)} .step[data-step=days]{--c:var(--days)}
.step .num{color:var(--c)}
.step.active{background:var(--c);border-color:var(--c);color:#0b0f14}
.step.active .num{background:rgba(0,0,0,.22);color:#0b0f14}
.top-right{display:flex;align-items:center;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:17px}
.icon-btn:hover:not(:disabled){background:var(--panel3)}
.icon-btn:disabled{opacity:.35;cursor:default}
.save-status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 6px;white-space:nowrap}
.save-status.ok i{color:var(--route)} .save-status.err{color:#fca5a5} .save-status.err i{color:var(--danger)}

/* ---------- Main layout ---------- */
main{display:grid;grid-template-columns:400px 1fr;min-height:0}
#panel{position:relative;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:500}
.panel-body{flex:1;overflow-y:auto;padding:16px 16px 40px}
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#1a1f27}
.mob-handle{display:none}

/* ---------- Generic UI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:10px 18px;border-radius:12px;border:none;font-weight:700;font-size:16px;background:var(--panel3);color:var(--text);text-align:center;line-height:1.15}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:default}
.btn.big{min-height:56px;font-size:17px;width:100%}
.btn.blue{background:var(--pins);color:#fff}
.btn.green{background:var(--route);color:#06210f}
.btn.amber{background:var(--days);color:#2a1700}
.btn.purple{background:var(--doc);color:#fff}
.btn.red{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel2)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:15px;border-radius:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}
.hint{color:var(--muted);font-size:15px;margin:10px 0}
.label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin:18px 0 7px;text-transform:uppercase;letter-spacing:.04em}
.input{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.input:focus{border-color:var(--pins);outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.3)}
textarea.input{min-height:110px;resize:vertical;line-height:1.4}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px}
.section-title h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty i.big{font-size:40px;color:var(--faint);display:block;margin-bottom:12px}
.empty b{color:var(--text);display:block;font-size:18px;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:700;background:var(--panel3);color:var(--muted);white-space:nowrap}
.pill.ferry{background:rgba(56,189,248,.15);color:var(--ferry)}
.pill.warn{background:rgba(245,158,11,.16);color:#fbbf24}
.pill.err{background:rgba(239,68,68,.16);color:#fca5a5}

/* ---------- Pins step ---------- */
.layer{margin-top:10px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.layer-head{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 4px;background:var(--panel2)}
.layer.active .layer-head{box-shadow:inset 4px 0 0 var(--pins)}
.layer-head .lh-name{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;background:none;border:none;padding:6px 4px;text-align:left}
.layer-head .lh-name b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.layer-head .lh-name small{font-size:13px;color:var(--muted)}
.layer.active .lh-name small{color:#93c5fd}
.mini-btn{width:40px;height:40px;border-radius:10px;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:16px;flex:none}
.mini-btn:hover{background:var(--panel3);color:var(--text)}
.layer.hidden-layer .layer-pins, .layer.collapsed .layer-pins{display:none}
.layer.hidden-layer .lh-name b{color:var(--faint);text-decoration:line-through}
.pin-row{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:none;border-top:1px solid var(--line);background:var(--panel);text-align:left;min-height:54px}
.pin-row:hover{background:var(--panel2)}
.pin-row.sel{background:#1d2a40}
.dot{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;background:var(--c);color:var(--fg)}
.pin-row .txt{flex:1;min-width:0}
.pin-row .txt b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin-row .txt small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stopnum{min-width:30px;height:26px;border-radius:13px;padding:0 7px;display:grid;place-items:center;background:var(--route);color:#06210f;font-size:13px;font-weight:700}

/* ---------- Route & days ---------- */
.totals{display:flex;flex-direction:column;gap:6px;background:linear-gradient(135deg,rgba(34,197,94,.16),rgba(34,197,94,.04));border:1px solid rgba(34,197,94,.35);border-radius:14px;padding:14px}
.totals .big-num{font-size:24px;font-weight:700}
.totals .sub{color:var(--muted);font-size:15px}
.totals.days{background:linear-gradient(135deg,rgba(245,158,11,.16),rgba(245,158,11,.04));border-color:rgba(245,158,11,.4)}
.stops{list-style:none;margin:12px 0 0;padding:0}
.stop{background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:0}
.stop-main{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 4px;min-height:56px}
.stop .drag{width:38px;height:44px;display:grid;place-items:center;color:var(--faint);cursor:grab;touch-action:none;flex:none;border:none;background:none;font-size:17px}
.stop .drag:active{cursor:grabbing}
.stop .snum{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--route);color:#06210f}
.stop .txt{flex:1;min-width:0;cursor:pointer}
.stop .txt b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .txt small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:8px 10px 8px 48px;font-size:14px;color:var(--muted);position:relative;min-height:40px;cursor:pointer}
.leg:before{content:"";position:absolute;left:28px;top:0;bottom:0;border-left:3px dotted #3a4558}
.leg .arrow{color:var(--route)}
.leg b{color:var(--text)}
.leg.pending{color:var(--faint)}
.leg .retry{border:none;background:none;color:#93c5fd;text-decoration:underline;padding:0;font-size:14px}
.sortable-ghost{opacity:.35}
.sortable-chosen .stop-main{background:var(--panel3)}
.day{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-head{padding:12px 14px;background:linear-gradient(90deg,rgba(245,158,11,.2),rgba(245,158,11,.05));border-bottom:1px solid var(--line)}
.day-head .d1{font-size:13px;font-weight:700;color:#fbbf24;text-transform:uppercase;letter-spacing:.05em}
.day-head .d2{font-size:18px;font-weight:700;margin:3px 0}
.day-head .d3{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}
.day .stop{border-radius:0;border:none;border-top:1px solid var(--line);background:var(--panel)}
.day .stop:first-child{border-top:none}
.night-btn{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.night-btn:hover{border-color:var(--days);color:var(--text)}
.night-btn.on{background:var(--days);border-color:var(--days);color:#2a1700}
.endpoint{font-size:13px;color:var(--faint);padding-right:8px;white-space:nowrap}
.row-inline{display:flex;gap:8px;align-items:center}

/* ---------- Editor ---------- */
.editor{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:5}
.ed-top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ed-top h2{flex:1;margin:0;font-size:17px;color:var(--muted);text-align:center}
.ed-body{flex:1;overflow-y:auto;padding:4px 16px 40px}
.name-input{font-size:20px;font-weight:700;min-height:54px}
.place-line{color:var(--muted);font-size:14px;margin-top:8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;background:var(--c);display:grid;place-items:center;color:var(--fg);font-size:15px;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.ic{height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:19px;color:var(--muted);padding:0}
.ic:hover{background:var(--panel3);color:var(--text)}
.ic.on{background:var(--c);border-color:var(--c);color:var(--fg)}
.links{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.link-row{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px;min-height:48px}
.link-row a{flex:1;min-width:0;color:#93c5fd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.link-row a:hover{text-decoration:underline}
.ed-route{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tip{display:flex;gap:10px;align-items:flex-start;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#bfdbfe;border-radius:12px;padding:11px 13px;font-size:15px;margin-top:20px}

/* ---------- Map overlays ---------- */
.map-search{position:absolute;top:12px;left:12px;width:min(380px,calc(100% - 24px));z-index:1000}
.search-field{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.search-field i{padding:0 4px 0 14px;color:var(--muted)}
.search-field input{flex:1;min-width:0;border:none;background:transparent;min-height:50px;padding:0 10px;font-size:16px;outline:none}
.search-field .mini-btn{margin-right:4px}
.results{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.45);max-height:60vh;overflow-y:auto}
.result{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px;border:none;border-top:1px solid var(--line);background:none;min-height:56px}
.result:first-child{border-top:none}
.result:hover,.result.kb{background:var(--panel2)}
.result i{color:var(--muted);width:18px;text-align:center}
.result b{display:block}
.result small{display:block;color:var(--muted);font-size:13px}
.results .note{padding:14px;color:var(--muted)}
.map-tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:1000;align-items:flex-end}
.tool{display:flex;align-items:center;gap:9px;min-height:46px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tool:hover{background:var(--panel2)}
.tool.on{background:var(--measure);border-color:var(--measure);color:#2a2000}
.tool i{width:18px;text-align:center}
.basemaps{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.basemaps button{min-width:150px;min-height:44px;text-align:left;padding:0 12px;border-radius:9px;border:1px solid transparent;background:var(--panel2);font-weight:700;display:flex;align-items:center;gap:10px}
.basemaps button.on{border-color:var(--pins);background:#1d2a40}
.banner{position:absolute;left:50%;transform:translateX(-50%);top:76px;z-index:990;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:14px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 24px)}
.banner.add{background:var(--pins);color:#fff}
.banner.route{background:var(--route);color:#06210f}
.banner.measure{background:var(--measure);color:#2a2000}
.banner .btn{min-height:42px;background:rgba(0,0,0,.25);color:inherit}
.banner.route .btn,.banner.measure .btn{background:rgba(0,0,0,.14)}
.measure-card{position:absolute;left:12px;bottom:24px;z-index:1000;width:min(340px,calc(100% - 24px));background:var(--panel);border:2px solid var(--measure);border-radius:14px;padding:14px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.measure-card .m-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:16px}
.measure-card .m-row span{color:var(--muted)}
.measure-card .m-row b{font-size:18px;text-align:right}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 24px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:#f1f5f9;color:#0f172a;border-radius:12px;padding:10px 10px 10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);min-height:50px}
.toast.err{background:#fee2e2;color:#7f1d1d}
.toast button{border:none;background:#0f172a;color:#fff;border-radius:9px;min-height:38px;padding:0 14px;font-weight:700}
.loading-pill{display:inline-flex;align-items:center;gap:8px}

/* ---------- Markers ---------- */
.mk{position:relative;width:32px;height:42px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.mk svg{position:absolute;inset:0;width:32px;height:42px}
.mk i{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:14px;color:var(--fg)}
.mk .mk-num{position:absolute;top:-9px;right:-12px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#0b0f14;color:#86efac;border:2px solid var(--route);font:700 12px/18px var(--font);text-align:center}
.mk.sel{transform:scale(1.25);transform-origin:50% 100%;z-index:1}
.mk.sel:after{content:"";position:absolute;left:4px;right:4px;bottom:-5px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);z-index:-1}
.mk.dim{opacity:.55}
.leaflet-container{font-family:var(--font)}
.leaflet-tooltip.pin-tip{background:var(--panel);color:var(--text);border:1px solid var(--line);font-size:14px;font-weight:700;padding:5px 9px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.leaflet-tooltip.pin-tip:before{border-top-color:var(--panel)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.leaflet-popup-content{margin:14px 16px;font-size:15px}
.leaflet-popup-content .pp-title{font-size:17px;font-weight:700;margin-bottom:3px}
.leaflet-popup-content .pp-sub{color:var(--muted);margin-bottom:12px}
.leaflet-popup-content .btn{width:100%;margin-top:6px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted);font-size:22px;width:30px;height:30px}
.search-mk{width:26px;height:26px;border-radius:50%;background:#fff;border:6px solid var(--pins);box-shadow:0 0 0 6px rgba(59,130,246,.35)}
.leaflet-control-attribution{background:rgba(14,18,24,.75)!important;color:#9aa4b2!important}
.leaflet-control-attribution a{color:#bcd2f5!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--line)!important;width:40px!important;height:40px!important;line-height:40px!important;font-size:20px!important}
.leaflet-bar{border:1px solid var(--line)!important}
.measure-label{background:var(--measure);color:#2a2000;border:none;font-weight:700;font-size:13px;padding:3px 8px;border-radius:8px;box-shadow:none}
.measure-label:before{display:none}
.adding .leaflet-container,.measuring .leaflet-container{cursor:crosshair}
.adding .leaflet-marker-icon{cursor:default}

/* ---------- Menus & modals ---------- */
.menu{position:absolute;z-index:2500;min-width:270px;max-width:calc(100vw - 20px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.55);max-height:75vh;overflow-y:auto}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:8px 12px;border:none;border-radius:9px;background:none;text-align:left;font-size:16px}
.menu button:hover{background:var(--panel2)}
.menu button i{width:20px;text-align:center;color:var(--muted)}
.menu button.cur{color:#86efac} .menu button.cur i{color:#86efac}
.menu button.danger, .menu button.danger i{color:#fca5a5}
.menu hr{border:none;border-top:1px solid var(--line);margin:6px 4px}
.menu .mh{font-size:13px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px 4px}
.modal-back{position:fixed;inset:0;background:rgba(5,8,12,.7);z-index:4000;display:grid;place-items:center;padding:16px}
.modal{width:min(520px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{margin:0 0 12px;font-size:22px}
.modal p{color:var(--muted);margin:8px 0}
.modal ol{padding-left:22px;margin:8px 0;color:var(--muted)} .modal ol li{margin:7px 0}
.modal ol b{color:var(--text)}
.modal .btn-row{margin-top:20px;justify-content:flex-end}
.welcome-steps{display:grid;gap:10px;margin:14px 0}
.welcome-steps div{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border-radius:12px;padding:12px}
.welcome-steps .n{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#0b0f14}
.welcome-steps p{margin:2px 0 0;font-size:15px}
.drop-overlay{position:fixed;inset:0;z-index:5000;background:rgba(59,130,246,.25);border:4px dashed var(--pins);display:grid;place-items:center;font-size:24px;font-weight:700;pointer-events:none}

/* ---------- Phones ---------- */
@media (max-width:820px){
  .top{padding:8px 10px;gap:8px}
  .brand .bt{display:none}
  .trip-btn{flex:1;max-width:none;min-width:0}
  .steps{order:5;width:100%;margin:0}
  .step{flex:1;justify-content:center;padding:6px 8px;gap:6px;font-size:15px}
  .save-status .st{display:none}
  main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #mapwrap{grid-row:1}
  #panel{grid-row:2;height:46dvh;border-right:none;border-top:1px solid var(--line);transition:height .2s}
  #panel.collapsed{height:58px}
  #panel.collapsed .panel-body,#panel.collapsed .editor{display:none}
  .mob-handle{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:none;background:var(--panel2);color:var(--muted);font-weight:700;font-size:14px;border-bottom:1px solid var(--line);flex:none}
  #panel.collapsed .mob-handle{min-height:58px}
  .map-search{width:calc(100% - 20px);left:10px;top:10px}
  .search-field input{min-height:46px}
  .map-tools{top:66px;right:10px;gap:6px}
  .tool .tl{display:none}
  .tool{padding:0;width:44px;min-height:44px;justify-content:center}
  .leaflet-control-zoom,.leaflet-control-scale{display:none}
  .leaflet-control-attribution{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100vw}
  .step{min-height:42px}
  #panel{height:42dvh}
  .banner{top:auto;bottom:14px;font-size:15px;width:max-content}
  .measure-card{bottom:74px}
}
</style>

<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 42" aria-hidden="true"><path d="M16 1C7.7 1 1 7.6 1 15.8c0 10.6 13.2 24 14.1 25a1.2 1.2 0 0 0 1.8 0C17.8 39.8 31 26.4 31 15.8 31 7.6 24.3 1 16 1z" fill="#22c55e"/><circle cx="16" cy="15.5" r="5.5" fill="#0e1218"/></svg>
      <span class="bt">Larson Family Maps</span>
    </div>
    <button class="trip-btn" id="tripBtn" title="Switch or manage trips"><i class="fa-solid fa-suitcase-rolling"></i><span id="tripName">Trip</span><i class="fa-solid fa-caret-down"></i></button>
    <nav class="steps" aria-label="Steps">
      <button class="step" data-step="pins"><span class="num">1</span>Pins</button>
      <button class="step" data-step="route"><span class="num">2</span>Route</button>
      <button class="step" data-step="days"><span class="num">3</span>Days</button>
    </nav>
    <div class="top-right">
      <div class="save-status ok" id="saveStatus" title="Your trips save automatically in this browser"><i class="fa-solid fa-circle-check"></i><span class="st">Saved</span></div>
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl/⌘ Z)" aria-label="Undo"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="icon-btn" id="redoBtn" title="Redo" aria-label="Redo"><i class="fa-solid fa-rotate-right"></i></button>
      <button class="icon-btn" id="moreBtn" title="Import, export and help" aria-label="More"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>
  <main>
    <aside id="panel">
      <button class="mob-handle" id="mobHandle"><i class="fa-solid fa-chevron-down"></i><span>Hide list</span></button>
      <div class="panel-body" id="panelBody"></div>
      <div class="editor" id="editor" hidden></div>
    </aside>
    <div id="mapwrap">
      <div id="map"></div>
      <div class="map-search" id="mapSearch">
        <div class="search-field">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input id="searchInput" type="text" placeholder="Search for a place or address" autocomplete="off" enterkeyhint="search" aria-label="Search for a place">
          <button class="mini-btn" id="searchClear" hidden aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="results" id="searchResults" hidden></div>
      </div>
      <div class="map-tools">
        <button class="tool" id="styleBtn" title="Change map style"><i class="fa-solid fa-layer-group"></i><span class="tl">Map style</span></button>
        <div class="basemaps" id="basemapMenu" hidden></div>
        <button class="tool" id="measureBtn" title="Measure a distance"><i class="fa-solid fa-ruler"></i><span class="tl">Measure</span></button>
        <button class="tool" id="fitBtn" title="Zoom to show the whole trip"><i class="fa-solid fa-expand"></i><span class="tl">Show all</span></button>
      </div>
      <div class="banner" id="banner" hidden></div>
      <div class="measure-card" id="measureCard" hidden></div>
    </div>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fileInput" accept=".kml,.kmz,.json,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
'use strict';
/* =========================================================
   Larson Family Maps — trip planner
   Everything lives in this one file. Trips save in the
   browser (localStorage). Routing: public OSRM servers.
   Search: Photon (komoot). Map tiles: CARTO, Esri, OpenTopoMap.
   ========================================================= */

const APP_VERSION = 1;
const STORE_KEY = 'lfm.data.v1';
const LEGS_KEY  = 'lfm.legs.v2';
const PREFS_KEY = 'lfm.prefs.v1';
const VALHALLA = 'https://valhalla1.openstreetmap.de/route';
const OSRM = ['https://router.project-osrm.org/route/v1/driving/', 'https://routing.openstreetmap.de/routed-car/route/v1/driving/'];
const PHOTON = 'https://photon.komoot.io';
const NOMINATIM = 'https://nominatim.openstreetmap.org';
const DOCX_URL  = 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
const JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';

const COLORS = [
  ['#e53935','Red'],['#fb8c00','Orange'],['#fdd835','Yellow'],['#7cb342','Lime'],['#2e9d4f','Green'],['#00897b','Teal'],
  ['#00acc1','Aqua'],['#1e88e5','Blue'],['#3949ab','Indigo'],['#8e24aa','Purple'],['#d81b60','Pink'],['#795548','Brown'],['#78909c','Gray'],['#f5f5f5','White']
];
const DEFAULT_COLOR = '#1e88e5';
const ICONS = [
 ['location-dot','Pin'],['star','Star'],['heart','Favorite'],['flag','Flag'],['question','Maybe'],['house','Home'],['bed','Hotel'],['hotel','Lodging'],
 ['campground','Campground'],['tent','Tent'],['caravan','RV / camper'],['fire','Campfire'],['utensils','Restaurant'],['burger','Fast food'],['pizza-slice','Pizza'],['mug-hot','Coffee'],
 ['ice-cream','Ice cream'],['beer-mug-empty','Brewery'],['wine-glass','Winery'],['cart-shopping','Groceries'],['shop','Shop'],['gas-pump','Gas'],['plug-circle-bolt','Supercharger'],['charging-station','EV charger'],
 ['square-parking','Parking'],['restroom','Restroom'],['shower','Shower'],['car','Car'],['ferry','Ferry'],['ship','Ship'],['anchor','Harbor'],['plane','Airport'],
 ['train','Train'],['bus','Bus'],['route','Scenic drive'],['signs-post','Trailhead'],['person-hiking','Hike'],['person-biking','Bike'],['person-swimming','Swim'],['person-skiing','Ski'],
 ['sailboat','Boating'],['fish','Fishing'],['mountain','Mountain'],['mountain-sun','Viewpoint'],['tree','Park / forest'],['leaf','Nature'],['water','Lake / river'],['umbrella-beach','Beach'],
 ['binoculars','Wildlife'],['paw','Animals'],['camera','Photo spot'],['tower-observation','Lookout'],['landmark','Landmark'],['monument','Monument'],['building-columns','Museum'],['church','Church'],
 ['city','City'],['bridge','Bridge'],['masks-theater','Show'],['music','Music'],['ticket','Tickets'],['golf-ball-tee','Golf'],['sun','Sunny spot'],['snowflake','Snow'],
 ['gem','Hidden gem'],['circle-info','Info'],['triangle-exclamation','Caution']
];
const ICON_SET = new Set(ICONS.map(i => i[0]));
const STATE_ABBR = {"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY","District of Columbia":"DC","Puerto Rico":"PR",
 "Alberta":"AB","British Columbia":"BC","Manitoba":"MB","New Brunswick":"NB","Newfoundland and Labrador":"NL","Nova Scotia":"NS","Ontario":"ON","Prince Edward Island":"PE","Quebec":"QC","Québec":"QC","Saskatchewan":"SK","Northwest Territories":"NT","Nunavut":"NU","Yukon":"YT"};

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TAP = matchMedia('(pointer: coarse)').matches ? 'Tap' : 'Click';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function isLight(hex){ const h = hex.replace('#',''); const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16); return (0.299*r + 0.587*g + 0.114*b) > 170; }
function fgFor(hex){ return isLight(hex) ? '#111' : '#fff'; }
function haversine(a, b){ const R = 6371008.8, toR = Math.PI/180; const dLat = (b.lat-a.lat)*toR, dLng = (b.lng-a.lng)*toR; const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.min(1, Math.sqrt(s))); }
function miles(m){ const mi = m / 1609.344; if (mi < 10) return (Math.round(mi*10)/10).toLocaleString() + ' mi'; return Math.round(mi).toLocaleString() + ' mi'; }
function milesWord(m){ const mi = m / 1609.344; const v = mi < 10 ? Math.round(mi*10)/10 : Math.round(mi); return v.toLocaleString() + (v === 1 ? ' mile' : ' miles'); }
function hrs(s){ const m = Math.round(s/60); if (m < 60) return m + ' min'; const h = Math.floor(m/60), r = m % 60; return r ? `${h} h ${r} min` : `${h} h`; }
function hrsWord(s){ const m = Math.round(s/60); if (m < 60) return m + ' minutes'; const h = Math.floor(m/60), r = m % 60; return `${h} hour${h===1?'':'s'}` + (r ? ` ${r} minute${r===1?'':'s'}` : ''); }
function normUrl(u){ u = String(u||'').trim(); if (!u) return null; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u; try { const x = new URL(u); if (!/^https?:$/.test(x.protocol)) return null; if (!x.hostname.includes('.')) return null; return x.href; } catch { return null; } }
function linkLabel(u){ try { const x = new URL(u); let p = (x.hostname.replace(/^www\./,'') + x.pathname).replace(/\/$/,''); return p.length > 48 ? p.slice(0,46) + '…' : p; } catch { return u; } }
function loadScript(src){ return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`) && (src !== DOCX_URL || window.docx) && (src !== JSZIP_URL || window.JSZip)) return res(); const s = document.createElement('script'); s.src = src; s.onload = () => res(); s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); }
function safeName(s){ return String(s||'trip').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,80) || 'trip'; }
async function fetchJSON(url, ms = 15000){ const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); try { const r = await fetch(url, {signal: c.signal}); const j = await r.json().catch(() => null); return {ok: r.ok, status: r.status, json: j}; } finally { clearTimeout(t); } }

/* =========================================================
   DATA + SAVING
   ========================================================= */
let db = {version: APP_VERSION, trips: [], currentId: null};
let prefs = {basemap: 'dark', step: 'pins', seenWelcome: false};
let storageOK = true;

function newTrip(name){ const lid = uid(); return {id: uid(), name: name || 'New trip', created: Date.now(), updated: Date.now(), layers: [{id: lid, name: 'Places', visible: true}], activeLayerId: lid, pins: [], route: [], startDate: '', maxDayHours: 7}; }
function normalizeTrip(t){
  if (!t.id) t.id = uid();
  t.name = String(t.name || 'Untitled trip');
  if (!Array.isArray(t.layers) || !t.layers.length) t.layers = [{id: uid(), name: 'Places', visible: true}];
  t.layers.forEach(l => { l.id ||= uid(); l.name = String(l.name || 'Layer'); l.visible = l.visible !== false; });
  if (!t.layers.some(l => l.id === t.activeLayerId)) t.activeLayerId = t.layers[0].id;
  if (!Array.isArray(t.pins)) t.pins = [];
  const lids = new Set(t.layers.map(l => l.id));
  t.pins = t.pins.filter(p => p && isFinite(p.lat) && isFinite(p.lng));
  t.pins.forEach(p => { p.id ||= uid(); p.name = String(p.name ?? 'Pin'); p.notes = String(p.notes || ''); p.links = Array.isArray(p.links) ? p.links.filter(l => l && l.url) : []; if (!/^#[0-9a-f]{6}$/i.test(p.color||'')) p.color = DEFAULT_COLOR; if (!ICON_SET.has(p.icon)) p.icon = 'location-dot'; if (!lids.has(p.layerId)) p.layerId = t.layers[0].id; });
  const pids = new Set(t.pins.map(p => p.id));
  t.route = (Array.isArray(t.route) ? t.route : []).filter(s => s && pids.has(s.pinId));
  t.route.forEach(s => { s.sid ||= uid(); s.overnight = !!s.overnight; });
  t.startDate = typeof t.startDate === 'string' ? t.startDate : '';
  t.maxDayHours = clamp(Number(t.maxDayHours) || 7, 1, 20);
  return t;
}
function load(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.trips)) db = d; } } catch (e) { storageOK = false; }
  try { const p = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null'); if (p) prefs = Object.assign(prefs, p); } catch {}
  db.trips = (db.trips || []).filter(Boolean).map(normalizeTrip);
  if (!db.trips.length) { const t = newTrip('My first trip'); db.trips.push(t); db.currentId = t.id; }
  if (!db.trips.some(t => t.id === db.currentId)) db.currentId = db.trips[0].id;
}
const trip = () => db.trips.find(t => t.id === db.currentId);
const pinById = id => trip().pins.find(p => p.id === id);
const layerById = id => trip().layers.find(l => l.id === id);

let saveTimer = null;
function scheduleSave(){ setSave('saving'); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
function saveNow(){
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); setSave('ok'); }
  catch (e) {
    trimLegCache(0.4);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); setSave('ok'); }
    catch (e2) { setSave('err'); toast('Could not save in this browser. Use ☰ → “Download a backup” right away.', {err: true, ms: 12000}); }
  }
}
function savePrefs(){ try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} }
function setSave(s){
  const el = $('#saveStatus');
  if (s === 'ok') { el.className = 'save-status ok'; el.innerHTML = '<i class="fa-solid fa-circle-check"></i><span class="st">Saved</span>'; }
  else if (s === 'saving') { el.className = 'save-status'; el.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span class="st">Saving…</span>'; }
  else { el.className = 'save-status err'; el.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i><span class="st">Not saved</span>'; }
}
window.addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) saveNow(); });
window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY || !e.newValue) return;
  try { const d = JSON.parse(e.newValue); if (!d || !Array.isArray(d.trips)) return; const cur = db.currentId; db = d; db.trips = db.trips.map(normalizeTrip); if (db.trips.some(t => t.id === cur)) db.currentId = cur; else db.currentId = db.trips[0].id; if (ui.editorPinId && !pinById(ui.editorPinId)) ui.editorPinId = null; render(); toast('Updated from another window'); } catch {}
});

/* ---------- undo / redo ---------- */
const hist = {};
let coalesce = null;
function H(){ const id = db.currentId; return hist[id] ||= {undo: [], redo: []}; }
function change(label, fn, opts = {}){
  const t = trip(), h = H(), now = Date.now();
  const same = opts.key && coalesce && coalesce.key === opts.key && coalesce.trip === t.id && now - coalesce.time < 5000;
  if (!same) { h.undo.push({label, snap: JSON.stringify(t)}); if (h.undo.length > 200) h.undo.shift(); h.redo.length = 0; }
  coalesce = opts.key ? {key: opts.key, time: now, trip: t.id} : null;
  fn(t); t.updated = now; scheduleSave();
  if (opts.render === 'map') { renderMap(); renderTop(); }
  else if (opts.render !== false) render();
  else renderTop();
}
function replaceTrip(obj){ const i = db.trips.findIndex(t => t.id === db.currentId); db.trips[i] = normalizeTrip(obj); if (ui.editorPinId && !pinById(ui.editorPinId)) ui.editorPinId = null; scheduleSave(); render(); }
function undo(){ const h = H(); if (!h.undo.length) return; const e = h.undo.pop(); h.redo.push({label: e.label, snap: JSON.stringify(trip())}); coalesce = null; replaceTrip(JSON.parse(e.snap)); toast('Undid: ' + e.label); }
function redo(){ const h = H(); if (!h.redo.length) return; const e = h.redo.pop(); h.undo.push({label: e.label, snap: JSON.stringify(trip())}); coalesce = null; replaceTrip(JSON.parse(e.snap)); toast('Redid: ' + e.label); }

/* =========================================================
   UI STATE
   ========================================================= */
const ui = {step: 'pins', mode: null, editorPinId: null, selectedPinId: null, filter: '', collapsed: new Set(), sorting: false, panelDirty: false};

/* ---------- toasts ---------- */
function toast(msg, o = {}){
  const box = $('#toasts'); const el = document.createElement('div'); el.className = 'toast' + (o.err ? ' err' : '');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (o.action) { const b = document.createElement('button'); b.textContent = o.action; b.onclick = () => { el.remove(); o.onAction(); }; el.appendChild(b); }
  [...box.children].forEach(c => { if (c.firstChild && c.firstChild.textContent === msg) c.remove(); });
  box.appendChild(el); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), o.ms || (o.action ? 7000 : 3500));
}
function undoToast(msg){ toast(msg, {action: 'Undo', onAction: undo}); }

/* ---------- modals ---------- */
function modal({title, html, buttons = [], onOpen, wide}){
  return new Promise(resolve => {
    const back = document.createElement('div'); back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" ${wide ? 'style="width:min(640px,100%)"' : ''}><h2>${esc(title)}</h2><div class="m-body">${html || ''}</div><div class="btn-row"></div></div>`;
    const row = back.querySelector('.btn-row');
    const close = v => { back.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    buttons.forEach(b => { const el = document.createElement('button'); el.className = 'btn ' + (b.kind || 'ghost'); el.innerHTML = b.label; el.onclick = () => { const v = b.value !== undefined ? b.value : true; if (b.get) close(b.get(back)); else close(v); }; row.appendChild(el); });
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } if (e.key === 'Enter' && e.target.tagName === 'INPUT') { const p = buttons.find(b => b.primary); if (p) { e.preventDefault(); close(p.get ? p.get(back) : (p.value ?? true)); } } };
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('mousedown', e => { if (e.target === back) close(null); });
    document.body.appendChild(back);
    if (onOpen) onOpen(back, close);
    const first = back.querySelector('input,textarea'); if (first) { first.focus(); first.select?.(); } else row.lastChild?.focus();
  });
}
function askText(title, label, value, okLabel = 'Save'){
  return modal({title, html: `<label class="label" style="margin-top:4px">${esc(label)}</label><input class="input" id="askInput" maxlength="120" value="${esc(value || '')}">`,
    buttons: [{label: 'Cancel', value: null}, {label: okLabel, kind: 'blue', primary: true, get: b => b.querySelector('#askInput').value.trim() || null}]});
}
function askConfirm(title, message, okLabel = 'OK', danger = false){

function addAllPins(){
  const t = trip(); const vis = new Set(t.layers.filter(l => l.visible).map(l => l.id));
  const inRoute = new Set(t.route.map(s => s.pinId));
  let rest = t.pins.filter(p => vis.has(p.layerId) && !inRoute.has(p.id));
  if (!rest.length) { toast('Every pin is already in the route.'); return; }
  const order = []; let cur = t.route.length ? pinById(t.route[t.route.length - 1].pinId) : rest[0];
  if (!t.route.length) { order.push(rest[0]); rest = rest.slice(1); }
  while (rest.length) { let bi = 0, bd = Infinity; rest.forEach((p, i) => { const d = haversine(cur, p); if (d < bd) { bd = d; bi = i; } }); cur = rest[bi]; order.push(cur); rest.splice(bi, 1); }

}
function suggestOrder(){
  const t = trip(); const n = t.route.length;
  if (n < 4) { toast('Add at least 4 stops first. The first and last stops stay where they are.'); return; }
  const pts = t.route.map(s => pinById(s.pinId));
  const D = []; for (let i = 0; i < n; i++) { D.push(new Float64Array(n)); for (let j = 0; j < n; j++) D[i][j] = i === j ? 0 : haversine(pts[i], pts[j]); }
  const len = path => { let s = 0; for (let i = 0; i < path.length - 1; i++) s += D[path[i]][path[i + 1]]; return s; };
  const orig = [...Array(n).keys()]; const oldLen = len(orig);
  // nearest neighbour from the first stop, last stop fixed
  const rest = orig.slice(1, n - 1); const path = [0]; let cur = 0;
  while (rest.length) { let bi = 0; rest.forEach((x, i) => { if (D[cur][x] < D[cur][rest[bi]]) bi = i; }); cur = rest.splice(bi, 1)[0]; path.push(cur); }
  path.push(n - 1);
  const twoOpt = p => { let improved = true, passes = 0; while (improved && passes++ < 60) { improved = false; for (let i = 1; i < n - 2; i++) for (let k = i + 1; k < n - 1; k++) { const delta = D[p[i-1]][p[k]] + D[p[i]][p[k+1]] - D[p[i-1]][p[i]] - D[p[k]][p[k+1]]; if (delta < -1e-6) { p.splice(i, k - i + 1, ...p.slice(i, k + 1).reverse()); improved = true; } } } return p; };
  const a = twoOpt(path), b = twoOpt([...orig]);
  const best = len(a) <= len(b) ? a : b; const newLen = len(best);
  if (newLen >= oldLen - 1000) { toast('Your order is already about as short as it gets.'); return; }
  change('Suggest order', t => { const r = t.route; t.route = best.map(i => r[i]); });
  undoToast(`New order saves about ${milesWord(oldLen - newLen)} (straight-line estimate).`);
}

/* ---------- days ---------- */
function computeDays(t, stats){
  const n = t.route.length; if (!n) return [];
  const days = []; let cur = [0];

  days.push(cur);
  return days.map((idx, k) => {
    let d = 0, s = 0, missing = 0, ferry = null;
    for (let j = idx[0]; j < idx[idx.length - 1]; j++) { const l = stats.legs[j]; if (l && l.info && l.info.status === 'ok') { d += l.info.d; s += l.info.t; if (l.info.ferry) { ferry ||= {d: 0, t: 0}; ferry.d += l.info.ferry.d; ferry.t += l.info.ferry.t; } } else missing++; }
    let date = null; if (t.startDate) { const dt = new Date(t.startDate + 'T12:00:00'); if (!isNaN(dt)) { dt.setDate(dt.getDate() + k); date = dt; } }

function suggestDays(){

/* ---------- steps & modes ---------- */
function setStep(s){
  if (ui.editorPinId) { ui.editorPinId = null; $('#editor').hidden = true; }
  if (ui.mode === 'add' && s !== 'pins') ui.mode = null;
  ui.step = s; prefs.step = s; savePrefs();
  document.body.classList.toggle('adding', ui.mode === 'add');
  render();
  if (innerWidth <= 820) { $('#panel').classList.remove('collapsed'); updateHandle(); setTimeout(() => map.invalidateSize(), 220); }
}
document.querySelectorAll('.step').forEach(b => b.onclick = () => setStep(b.dataset.step));
function setMode(m){
  if (ui.mode === 'measure' && m !== 'measure') clearMeasure();
  ui.mode = m;
  if (m === 'add' && ui.step !== 'pins') { ui.step = 'pins'; prefs.step = 'pins'; }
  if (m === 'add' && ui.editorPinId) { ui.editorPinId = null; $('#editor').hidden = true; }
  document.body.classList.toggle('adding', m === 'add');
  document.body.classList.toggle('measuring', m === 'measure');
  $('#measureBtn').classList.toggle('on', m === 'measure');
  if (m === 'add') map.doubleClickZoom.disable(); else map.doubleClickZoom.enable();
  $('#measureCard').hidden = m !== 'measure';
  if (m === 'measure') renderMeasure();
  if (m && innerWidth <= 820) { $('#panel').classList.add('collapsed'); updateHandle(); setTimeout(() => map.invalidateSize(), 220); }
  render();
}

/* =========================================================
   SEARCH (Photon)
   ========================================================= */
let searchTimer = null, searchSeq = 0, searchResults = [], kbIndex = -1, previewMarker = null;
const sInput = $('#searchInput'), sBox = $('#searchResults');
sInput.addEventListener('input', () => {
  $('#searchClear').hidden = !sInput.value; clearTimeout(searchTimer);
  const q = sInput.value.trim(); if (q.length < 3) { sBox.hidden = true; return; }
  searchTimer = setTimeout(() => doSearch(q), 350);
});
sInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!searchResults.length) return; kbIndex = (kbIndex + (e.key === 'ArrowDown' ? 1 : -1) + searchResults.length) % searchResults.length; showResults(); }
  else if (e.key === 'Enter') { e.preventDefault(); clearTimeout(searchTimer); if (searchResults.length && !sBox.hidden) pickResult(Math.max(0, kbIndex)); else if (sInput.value.trim().length >= 2) doSearch(sInput.value.trim(), true); }
  else if (e.key === 'Escape') { sBox.hidden = true; sInput.blur(); }
});
sInput.addEventListener('focus', () => { if (searchResults.length && sInput.value.trim().length >= 3) sBox.hidden = false; });
$('#searchClear').onclick = () => { sInput.value = ''; $('#searchClear').hidden = true; sBox.hidden = true; searchResults = []; if (previewMarker) { map.removeLayer(previewMarker); previewMarker = null; } sInput.focus(); };
document.addEventListener('mousedown', e => { if (!e.target.closest('#mapSearch')) sBox.hidden = true; });
async function doSearch(q, pickFirst){
  const seq = ++searchSeq; sBox.hidden = false; sBox.innerHTML = '<div class="note"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching…</div>';
  const c = map.getCenter();
  try {
    const r = await fetchJSON(`${PHOTON}/api/?q=${encodeURIComponent(q)}&limit=7&lang=en&lat=${c.lat.toFixed(3)}&lon=${c.lng.toFixed(3)}&location_bias_scale=0.3`, 12000);
    if (seq !== searchSeq) return;
    const feats = (r.json && r.json.features) || [];
    searchResults = feats.map(f => { const pr = f.properties; const pl = photonPlace(pr); const name = pr.name || [pr.housenumber, pr.street].filter(Boolean).join(' ') || placeShort(pl) || 'Place';
      const sub = [pr.housenumber && pr.street ? `${pr.housenumber} ${pr.street}` : pr.street, placeShort(pl)].filter(Boolean).filter(x => x !== name).join(' · ');
      return {name, sub, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], place: pl, kind: pr.osm_value || pr.type || '', extent: pr.extent}; });
    kbIndex = -1; showResults(); if (pickFirst && searchResults.length) pickResult(0);
  } catch (e) { if (seq === searchSeq) sBox.innerHTML = '<div class="note"><i class="fa-solid fa-wifi"></i> Search isn’t reachable right now. Check your internet connection.</div>'; }
}
function kindIcon(k){ const m = {city: 'city', town: 'city', village: 'house', restaurant: 'utensils', cafe: 'mug-hot', fuel: 'gas-pump', hotel: 'bed', motel: 'bed', camp_site: 'campground', museum: 'building-columns', park: 'tree', national_park: 'tree', peak: 'mountain', viewpoint: 'mountain-sun', beach: 'umbrella-beach', attraction: 'star', aerodrome: 'plane', ferry_terminal: 'ferry', charging_station: 'charging-station', lake: 'water', water: 'water'}; return m[k] || 'location-dot'; }
function showResults(){
  if (!searchResults.length) { sBox.innerHTML = '<div class="note">No places found. Try adding a city or state.</div>'; sBox.hidden = false; return; }
  sBox.innerHTML = searchResults.map((r, i) => `<button class="result${i === kbIndex ? ' kb' : ''}" data-r="${i}"><i class="fa-solid fa-${kindIcon(r.kind)}"></i><span><b>${esc(r.name)}</b>${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</span></button>`).join('');
  sBox.hidden = false;
}
sBox.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) pickResult(+b.dataset.r); });
function pickResult(i){
  const r = searchResults[i]; if (!r) return; sBox.hidden = true; sInput.blur();
  if (previewMarker) map.removeLayer(previewMarker);
  if (r.extent && r.extent.length === 4) map.flyToBounds([[r.extent[1], r.extent[0]], [r.extent[3], r.extent[2]]], {maxZoom: 13, duration: .7});
  else map.flyTo([r.lat, r.lng], 13, {duration: .7});
  previewMarker = L.marker([r.lat, r.lng], {icon: L.divIcon({className: '', html: '<div class="search-mk"></div>', iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -14]}), zIndexOffset: 2000}).addTo(map);
  const div = document.createElement('div');
  div.innerHTML = `<div class="pp-title">${esc(r.name)}</div><div class="pp-sub">${esc(r.sub || '')}</div><button class="btn blue" data-pp="add"><i class="fa-solid fa-plus"></i>Add as a pin</button>${ui.step === 'route' ? '<button class="btn green" data-pp="addroute"><i class="fa-solid fa-route"></i>Add pin + add to route</button>' : ''}`;
  div.addEventListener('click', ev => { const b = ev.target.closest('[data-pp]'); if (!b) return;
    addPinAt(L.latLng(r.lat, r.lng), {name: r.name, place: r.place, toRoute: b.dataset.pp === 'addroute', icon: lastStyle.icon === 'location-dot' && kindIcon(r.kind) !== 'location-dot' ? kindIcon(r.kind) : undefined});
    map.removeLayer(previewMarker); previewMarker = null; sInput.value = ''; $('#searchClear').hidden = true; searchResults = []; });
  previewMarker.bindPopup(div, {minWidth: 240, maxWidth: 300, autoPanPadding: [40, 90]});
  setTimeout(() => previewMarker && previewMarker.openPopup(), 750);
}

/* =========================================================
   MEASURE
   ========================================================= */
const meas = {pts: [], road: null, seq: 0, timer: null};
$('#measureBtn').onclick = () => setMode(ui.mode === 'measure' ? null : 'measure');
function addMeasurePoint(ll){ meas.pts.push(L.latLng(ll.lat, ll.lng)); meas.road = meas.pts.length > 1 ? 'loading' : null; drawMeasure(); renderMeasure(); clearTimeout(meas.timer); if (meas.pts.length > 1) meas.timer = setTimeout(measureRoad, 450); }
function clearMeasure(){ meas.pts = []; meas.road = null; meas.seq++; measureLayer.clearLayers(); renderMeasure(); }
function undoMeasure(){ meas.pts.pop(); meas.seq++; meas.road = meas.pts.length > 1 ? 'loading' : null; drawMeasure(); renderMeasure(); clearTimeout(meas.timer); if (meas.pts.length > 1) meas.timer = setTimeout(measureRoad, 300); }
function straight(){ let d = 0; for (let i = 1; i < meas.pts.length; i++) d += haversine(meas.pts[i - 1], meas.pts[i]); return d; }
function drawMeasure(){
  measureLayer.clearLayers();
  if (meas.road && meas.road.coords) L.polyline(meas.road.coords, {color: '#facc15', weight: 4, opacity: .55, interactive: false}).addTo(measureLayer);
  if (meas.pts.length > 1) L.polyline(meas.pts, {color: '#facc15', weight: 3, dashArray: '8 8', interactive: false}).addTo(measureLayer);
  meas.pts.forEach((p, i) => { const c = L.circleMarker(p, {radius: 7, color: '#2a2000', weight: 2, fillColor: '#facc15', fillOpacity: 1, interactive: false}).addTo(measureLayer); if (i === meas.pts.length - 1 && i > 0) c.bindTooltip(miles(straight()), {permanent: true, direction: 'right', className: 'measure-label', offset: [8, 0]}).openTooltip(); });
}
async function measureRoad(){
  const seq = ++meas.seq; const pts = meas.pts.slice(0, 25).map(p => ({lat: p.lat, lng: p.lng}));
  const r = await getRoute(pts);
  if (seq !== meas.seq) return;
  if (r.ok) { const coords = []; let d = 0, t = 0; r.legs.forEach(l => { d += l.d; t += l.t; l.segs.forEach(sg => coords.push(...sg.c)); }); meas.road = {d, t, coords}; }
  else meas.road = {err: r.code === 'network' ? 'Couldn’t reach the directions service.' : 'No driving route between these spots.'};
  drawMeasure(); renderMeasure();
}
function renderMeasure(){
  const c = $('#measureCard'); if (ui.mode !== 'measure') { c.hidden = true; return; }
  c.hidden = false;
  if (!meas.pts.length) { c.innerHTML = `<b><i class="fa-solid fa-ruler"></i> Measure</b><p class="hint" style="margin-bottom:0">Click a spot on the map, then click another. You can click pins and cities too. Nothing gets saved.</p>`; return; }
  const road = meas.road === 'loading' ? '<i class="fa-solid fa-circle-notch fa-spin"></i>' : meas.road && meas.road.err ? `<span style="font-size:14px;color:#fca5a5">${meas.road.err}</span>` : meas.road ? `${miles(meas.road.d)}<br><small style="font-size:14px;color:var(--muted)">about ${hrs(meas.road.t)} driving</small>` : '—';
  c.innerHTML = `<b><i class="fa-solid fa-ruler"></i> Measure</b>
    <div class="m-row"><span>Straight line</span><b>${meas.pts.length > 1 ? miles(straight()) : '—'}</b></div>
    <div class="m-row"><span>By road</span><b>${road}</b></div>
    ${meas.pts.length === 1 ? '<p class="hint" style="margin:4px 0">Now click a second spot.</p>' : ''}
    <div class="btn-row" style="margin-top:8px"><button class="btn sm ghost" id="mUndo"><i class="fa-solid fa-rotate-left"></i>Last point</button><button class="btn sm ghost" id="mClear"><i class="fa-solid fa-eraser"></i>Start over</button></div>`;
  $('#mUndo').onclick = undoMeasure; $('#mClear').onclick = clearMeasure;
}

async function importFile(file){
  try {
    const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    const isZip = head[0] === 0x50 && head[1] === 0x4b;
    let text;
    if (isZip) {
      await loadScript(JSZIP_URL); const zip = await JSZip.loadAsync(file);
      const names = Object.keys(zip.files).filter(n => /\.kml$/i.test(n)); if (!names.length) throw new Error('No map inside this KMZ file.');
      text = await zip.file(names.find(n => /doc\.kml$/i.test(n)) || names[0]).async('string');
    } else text = await file.text();
    const trimmed = text.trim();
    if (trimmed.startsWith('{')) return restoreBackup(JSON.parse(trimmed));
    const res = parseKML(trimmed, file.name);
    if (!res.pins.length) { modal({title: 'No places found', html: `<p>That file didn’t have any pins in it${res.lines ? ` (it had ${res.lines} line${res.lines === 1 ? '' : 's'}, which this site doesn’t import yet)` : ''}.</p>`, buttons: [{label: 'OK', kind: 'blue'}]}); return; }
    const choice = await modal({title: `Import “${esc(res.name)}”`, html: `<p>Found <b style="color:var(--text)">${res.pins.length} place${res.pins.length === 1 ? '' : 's'}</b> in ${res.layers.length} layer${res.layers.length === 1 ? '' : 's'}.${res.lines ? ` (${res.lines} drawn line${res.lines === 1 ? '' : 's'} and route${res.lines === 1 ? '' : 's'} will be skipped. You’ll rebuild the route in Step 2.)` : ''}</p>`,
      buttons: [{label: 'Cancel', value: null}, {label: 'Add to this trip', kind: 'ghost', value: 'add'}, {label: '<i class="fa-solid fa-plus"></i> Make it a new trip', kind: 'blue', value: 'new'}]});
    if (!choice) return;
    if (choice === 'new') { const t = newTrip(res.name); t.layers = res.layers; t.activeLayerId = res.layers[0].id; t.pins = res.pins; db.trips.push(normalizeTrip(t)); switchTrip(t.id); setStep('pins'); }
    else { change('Import pins', t => { t.layers.push(...res.layers); t.pins.push(...res.pins); }); fitTrip(); }
    toast(`Imported ${res.pins.length} places.`);
  } catch (err) {
    console.error(err);
    modal({title: 'That file couldn’t be opened', html: `<p>Make sure it’s a KML or KMZ file exported from Google My Maps, or a backup file from this site.</p><p style="font-size:14px">${esc(err.message || '')}</p>`, buttons: [{label: 'OK', kind: 'blue'}]});
  }
}
function kmlColor(abgr){ const s = String(abgr || '').trim().replace('#', ''); if (!/^[0-9a-f]{8}$/i.test(s)) return null; return '#' + s.slice(6, 8) + s.slice(4, 6) + s.slice(2, 4); }
function parseKML(text, filename){
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('The file isn’t valid KML.');
  const kids = (el, tag) => [...el.children].filter(c => c.localName === tag);
  const kid = (el, tag) => kids(el, tag)[0];
  const txt = (el, tag) => { const k = el && kid(el, tag); return k ? k.textContent.trim() : ''; };
  const all = tag => [...doc.getElementsByTagNameNS('*', tag)];
  const styleColor = {};
  all('Style').forEach(s => { const id = s.getAttribute('id'); if (!id) return; const is = [...s.getElementsByTagNameNS('*', 'IconStyle')][0]; const c = is && kmlColor(txt(is, 'color')); if (c) styleColor['#' + id] = c; });
  all('StyleMap').forEach(sm => { const id = sm.getAttribute('id'); if (!id) return; const pair = kids(sm, 'Pair').find(p => txt(p, 'key') === 'normal') || kids(sm, 'Pair')[0]; const url = pair && txt(pair, 'styleUrl'); if (url && styleColor[url]) styleColor['#' + id] = styleColor[url]; });
  const docEl = all('Document')[0]; const name = (docEl && txt(docEl, 'name')) || filename.replace(/\.(kml|kmz)$/i, '') || 'Imported trip';
  const layers = []; const layerFor = new Map(); let lines = 0;
  const getLayer = folder => { const key = folder || null; if (layerFor.has(key)) return layerFor.get(key); const l = {id: uid(), name: folder ? (txt(folder, 'name') || 'Layer') : 'Imported places', visible: true}; layers.push(l); layerFor.set(key, l.id); return l.id; };
  const pins = [];
  for (const pm of all('Placemark')) {
    const pt = [...pm.getElementsByTagNameNS('*', 'Point')][0];
    if (!pt) { lines++; continue; }
    const coords = ([...pt.getElementsByTagNameNS('*', 'coordinates')][0]?.textContent || '').trim().split(/[\s,]+/).map(Number);
    if (coords.length < 2 || !isFinite(coords[0]) || !isFinite(coords[1])) continue;
    let folder = pm.parentElement; while (folder && folder.localName !== 'Folder' && folder.localName !== 'Document') folder = folder.parentElement;
    const layerId = getLayer(folder && folder.localName === 'Folder' ? folder : null);
    const styleUrl = txt(pm, 'styleUrl');
    let color = styleColor[styleUrl] || null;
    if (!color) { const m = styleUrl.match(/-([0-9A-Fa-f]{6})(?:-|$)/); if (m) color = '#' + m[1].toLowerCase(); }
    const rawDesc = txt(pm, 'description');
    const links = []; const addLink = u => { const n = normUrl(u.replace(/[).,;]+$/, '')); if (n && !links.some(l => l.url === n)) links.push({url: n}); };
    let notes = '';
    if (rawDesc) {
      const html = rawDesc.replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n');
      const hd = new DOMParser().parseFromString(html, 'text/html');
      hd.querySelectorAll('a[href]').forEach(a => addLink(a.getAttribute('href')));
      hd.querySelectorAll('img[src]').forEach(i => addLink(i.getAttribute('src')));
      notes = (hd.body.textContent || '');
      (notes.match(/https?:\/\/[^\s<>"']+/g) || []).forEach(addLink);
      notes = notes.replace(/https?:\/\/[^\s<>"']+/g, '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    }
    [...pm.getElementsByTagNameNS('*', 'Data')].forEach(d => { if (d.getAttribute('name') === 'gx_media_links') (txt(d, 'value').match(/https?:\/\/\S+/g) || []).forEach(addLink); });
    pins.push({id: uid(), name: txt(pm, 'name') || 'Untitled place', lat: +coords[1].toFixed(6), lng: +coords[0].toFixed(6), color: color || DEFAULT_COLOR, icon: 'location-dot', notes, links, layerId, place: null});
  }
  if (!layers.length) layers.push({id: uid(), name: 'Imported places', visible: true});
  return {name, layers: layers.filter(l => pins.some(p => p.layerId === l.id)), pins, lines};
}

/* ---------- export ---------- */
function xmlEsc(s){ return String(s ?? '').replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c])); }
function exportKML(){
  const t = trip(); const colors = [...new Set(t.pins.map(p => p.color.toLowerCase()))];
  const abgr = c => 'ff' + c.slice(5, 7) + c.slice(3, 5) + c.slice(1, 3);
  let k = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${xmlEsc(t.name)}</name>\n`;
  colors.forEach(c => { k += `<Style id="c${c.slice(1)}"><IconStyle><color>${abgr(c)}</color><scale>1.1</scale><Icon><href>https://maps.google.com/mapfiles/kml/paddle/wht-blank.png</href></Icon></IconStyle></Style>\n`; });
  k += `<Style id="route"><LineStyle><color>ff5ec522</color><width>5</width></LineStyle></Style>\n`;
  for (const l of t.layers) {
    const pins = t.pins.filter(p => p.layerId === l.id); if (!pins.length) continue;
    k += `<Folder><name>${xmlEsc(l.name)}</name>\n`;
    pins.forEach(p => { const desc = [p.notes, ...p.links.map(x => x.url)].filter(Boolean).join('\n'); k += `<Placemark><name>${xmlEsc(p.name)}</name>${desc ? `<description>${xmlEsc(desc)}</description>` : ''}<styleUrl>#c${p.color.slice(1).toLowerCase()}</styleUrl><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>\n`; });
    k += `</Folder>\n`;
  }
  const st = routeStats(t);
  if (t.route.length > 1) {
    const coords = []; st.legs.forEach(l => { if (l.info && l.info.status === 'ok') l.info.segs.forEach(s => s.c.forEach(c => coords.push(`${c[1]},${c[0]},0`))); else if (l.a && l.b) coords.push(`${l.a.lng},${l.a.lat},0`, `${l.b.lng},${l.b.lat},0`); });
    k += `<Folder><name>Driving route</name><Placemark><name>${xmlEsc(t.name)} route</name><styleUrl>#route</styleUrl><LineString><tessellate>1</tessellate><coordinates>${coords.join(' ')}</coordinates></LineString></Placemark></Folder>\n`;
  }
  k += `</Document></kml>`;
  download(new Blob([k], {type: 'application/vnd.google-earth.kml+xml'}), safeName(t.name) + '.kml');
  toast('KML file downloaded.');
}
function exportBackup(){
  const data = {app: 'larson-family-maps', version: APP_VERSION, exported: new Date().toISOString(), trips: db.trips};
  const d = new Date(); const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  download(new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'}), `Larson Family Maps backup ${stamp}.json`);
  toast('Backup downloaded. Keep it somewhere safe.');
}
async function restoreBackup(data){
  if (!data || data.app !== 'larson-family-maps' || !Array.isArray(data.trips)) throw new Error('This isn’t a Larson Family Maps backup file.');
  const n = data.trips.length;
  if (!await askConfirm('Restore from backup?', `This adds <b>${n} trip${n === 1 ? '' : 's'}</b> from the backup. <b>Nothing you have now gets deleted or changed.</b>`, 'Restore')) return;
  const names = new Set(db.trips.map(t => t.name)); let last = null;
  data.trips.forEach(raw => { const t = normalizeTrip(JSON.parse(JSON.stringify(raw))); t.id = uid(); if (names.has(t.name)) t.name += ' (restored)'; db.trips.push(t); last = t; });
  if (last) switchTrip(last.id);
  toast(`Restored ${n} trip${n === 1 ? '' : 's'}.`);
}

/* =========================================================
   TRIP PLAN  (Word document + plain text)
   ========================================================= */
function planData(){
  const t = trip(); const st = routeStats(t); const days = computeDays(t, st);
  return {t, st, days};
}
function dayDateLong(d){ return d.date ? d.date.toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'}) : ''; }
async function makeDoc(btn){
  const {t, st, days} = planData();
  if (t.route.length < 2) { toast('Make a route first (Step 2).'); return; }
  if (st.pending) { toast('Still loading some driving times. Try again in a few seconds.'); return; }
  const old = btn && btn.innerHTML; if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>Making the document…'; }
  try {
    await loadScript(DOCX_URL);
    const {Document, Packer, Paragraph, TextRun, HeadingLevel, ExternalHyperlink} = window.docx;
    const C = [];
    const P = (runs, o = {}) => C.push(new Paragraph(Object.assign({children: Array.isArray(runs) ? runs : [new TextRun(String(runs))]}, o)));
    P([new TextRun({text: t.name, bold: true})], {heading: HeadingLevel.TITLE});
    const range = days[0].date ? `${days[0].date.toLocaleDateString(undefined, {month: 'long', day: 'numeric'})} – ${days[days.length - 1].date.toLocaleDateString(undefined, {month: 'long', day: 'numeric', year: 'numeric'})}` : '';
    P([new TextRun({text: [range, `${days.length} day${days.length === 1 ? '' : 's'}`, `${t.route.length} stops`, `${milesWord(st.d)}`, `about ${hrsWord(st.s)} of driving`].filter(Boolean).join('  ·  '), color: '555555'})], {spacing: {after: 300}});
    if (st.errors) P([new TextRun({text: `Note: ${st.errors} drive${st.errors === 1 ? '' : 's'} couldn’t be found and ${st.errors === 1 ? 'is' : 'are'} not included in the totals.`, italics: true, color: 'B00020'})]);
    for (const d of days) {
      const from = stopTown(t, d.idx[0]), to = stopTown(t, d.idx[d.idx.length - 1]);
      P([new TextRun(`Day ${d.n}: ${from}${from !== to ? ' to ' + to : ''}`)], {heading: HeadingLevel.HEADING_1, spacing: {before: 360}});
      if (d.date) P([new TextRun({text: dayDateLong(d), bold: true})]);
      P([new TextRun({text: `${milesWord(d.d)}  ·  about ${hrsWord(d.s)} of driving`, color: '444444'})]);
      if (d.ferry) P([new TextRun({text: `Includes a ferry crossing: ${milesWord(d.ferry.d)}, about ${hrsWord(d.ferry.t)} on the water (plus boarding time).`, color: '0369A1'})]);
      P([new TextRun({text: 'Stops', bold: true})], {spacing: {before: 160}});
      d.idx.forEach((i, k) => {
        const p = pinById(t.route[i].pinId); const pl = pinLabel(p);
        const lead = k === 0 ? (d.n === 1 ? 'Start: ' : 'Leave: ') : (k === d.idx.length - 1 ? (i === t.route.length - 1 ? 'Trip ends: ' : 'Overnight: ') : '');
        P([new TextRun({text: lead, bold: true}), new TextRun({text: p.name, bold: true}), ...(pl ? [new TextRun({text: `  (${pl})`, color: '666666'})] : [])], {bullet: {level: 0}, spacing: {before: 80}});
        if (p.notes) p.notes.split('\n').filter(x => x.trim()).forEach(line => P([new TextRun({text: line, color: '333333'})], {indent: {left: 720}}));
        p.links.forEach(l => P([new ExternalHyperlink({children: [new TextRun({text: l.url, style: 'Hyperlink'})], link: l.url})], {indent: {left: 720}}));
        if (k < d.idx.length - 1) { const l = st.legs[i]; const x = l && l.info; const next = stopTitle(t, d.idx[k + 1]);
          P([new TextRun({text: x && x.status === 'ok' ? `→ Drive ${milesWord(x.d)}, about ${hrsWord(x.t)}, to ${next}${x.ferry ? ' (includes a ferry)' : ''}` : `→ Drive to ${next} (driving time unknown)`, italics: true, color: '15803D'})], {indent: {left: 720}, spacing: {before: 40}}); }
      });
    }
    const inRoute = new Set(t.route.map(s => s.pinId)); const others = t.pins.filter(p => !inRoute.has(p.id));
    if (others.length) {
      P([new TextRun('Other saved places (not on the route)')], {heading: HeadingLevel.HEADING_1, spacing: {before: 400}});
      t.layers.forEach(l => { const ps = others.filter(p => p.layerId === l.id); if (!ps.length) return; if (t.layers.length > 1) P([new TextRun({text: l.name, bold: true})], {spacing: {before: 160}});
        ps.forEach(p => { const pl = pinLabel(p); P([new TextRun({text: p.name}), ...(pl ? [new TextRun({text: `  (${pl})`, color: '666666'})] : []), ...(p.notes ? [new TextRun({text: ` — ${p.notes.replace(/\s*\n\s*/g, ' ')}`, color: '555555'})] : [])], {bullet: {level: 0}}); }); });
    }
    P([new TextRun({text: `Made with Larson Family Maps on ${new Date().toLocaleDateString()}. Drive times are estimates without traffic or stops.`, size: 18, color: '888888', italics: true})], {spacing: {before: 400}});
    const doc = new Document({creator: 'Larson Family Maps', title: t.name, styles: {default: {document: {run: {font: 'Calibri', size: 23}}}}, sections: [{properties: {page: {margin: {top: 1080, bottom: 1080, left: 1080, right: 1080}}}, children: C}]});
    const blob = await Packer.toBlob(doc);
    download(blob, `${safeName(t.name)} - Trip Plan.docx`);
    toast('Trip plan downloaded. Look in your Downloads folder.');
  } catch (err) { console.error(err); toast('Couldn’t make the Word file. Check your internet connection and try again.', {err: true, ms: 7000}); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = old; } }
}
function planText(){
  const {t, st, days} = planData(); const L = [];
  L.push(t.name.toUpperCase()); L.push(`${days.length} day${days.length === 1 ? '' : 's'} · ${t.route.length} stops · ${milesWord(st.d)} · about ${hrsWord(st.s)} of driving`); L.push('');
  for (const d of days) {
    const from = stopTown(t, d.idx[0]), to = stopTown(t, d.idx[d.idx.length - 1]);
    L.push(`Day ${d.n}: ${from}${from !== to ? ' to ' + to : ''}${d.date ? ' (' + dayDateLong(d) + ')' : ''}`);
    L.push(`  ${milesWord(d.d)} · about ${hrsWord(d.s)} of driving${d.ferry ? ' · includes a ferry' : ''}`);
    d.idx.forEach((i, k) => { const p = pinById(t.route[i].pinId); L.push(`  • ${p.name}${pinLabel(p) ? ' (' + pinLabel(p) + ')' : ''}`); if (p.notes) L.push('      ' + p.notes.replace(/\n+/g, ' / ')); p.links.forEach(l => L.push('      ' + l.url)); if (k < d.idx.length - 1) { const x = st.legs[i]?.info; if (x && x.status === 'ok') L.push(`      → ${miles(x.d)}, ${hrs(x.t)}`); } });
    L.push('');
  }
  return L.join('\n');
}
async function copyText(){
  const txt = planText();
  try { await navigator.clipboard.writeText(txt); toast('Trip plan copied. Paste it into an email, note or document.'); }
  catch { modal({title: 'Trip plan', html: `<p>Select all of this text and copy it:</p><textarea class="input" style="min-height:300px;font-size:14px" readonly>${esc(txt)}</textarea>`, buttons: [{label: 'Close', kind: 'blue'}]}); }
}

function showHelp(){

    <ol><li>On a computer, go to <b>google.com/maps/d</b> and open the map.</li><li>Click the <b>three dots ⋮</b> next to the map’s name.</li><li>Click <b>Export to KML/KMZ</b>.</li><li>Choose <b>Entire map</b>, then click <b>Download</b>.</li><li>Here, click <b>☰</b> (top right), then <b>Import a Google My Map</b>, and pick the file. You can also drag the file onto this page.</li></ol>

    <h3 style="margin:18px 0 6px">Where your trips are saved</h3><p>Trips save in <b>this browser on this device</b>. Use <b>☰ → Download a backup</b> now and then, and keep the file somewhere safe. Clearing your browser’s website data would erase trips that aren’t backed up.</p>`,
    buttons: [{label: 'Got it', kind: 'blue'}]});
}

/* ---------- mobile panel toggle ---------- */
function updateHandle(){ const c = $('#panel').classList.contains('collapsed'); $('#mobHandle').innerHTML = c ? '<i class="fa-solid fa-chevron-up"></i><span>Show list</span>' : '<i class="fa-solid fa-chevron-down"></i><span>Hide list</span>'; }
$('#mobHandle').onclick = () => { $('#panel').classList.toggle('collapsed'); updateHandle(); setTimeout(() => map.invalidateSize(), 220); };
window.addEventListener('resize', () => map.invalidateSize());

/* =========================================================
   START
   ========================================================= */
load();
ui.step = ['pins', 'route', 'days'].includes(prefs.step) ? prefs.step : 'pins';
setBasemap(prefs.basemap);
render();
if (trip().pins.length) fitTrip();
if (!storageOK) toast('This browser is blocking saving. Your trips won’t be kept after you close the page.', {err: true, ms: 12000});
if (!prefs.seenWelcome) showWelcome();
</script>
